name: Despliegue Automatizado del Portafolio

# 1. El Disparador (Trigger): Cuándo se debe activar el robot
on:
  push:
    branches: [ "main" ]

# 2. Los Permisos: El robot necesita permiso para escribir y actualizar tu web
permissions:
  contents: read
  pages: write
  id-token: write

# 3. Las Tareas (Jobs): Qué va a hacer el robot exactamente
jobs:
  deploy:
    runs-on: ubuntu-latest # Prende una máquina virtual con Linux
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar las herramientas de GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir los archivos de la página web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Sube todo lo que esté en la carpeta principal

      - name: Publicar en internet en vivo
        id: deployment
        uses: actions/deploy-pages@v4
