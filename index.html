    <title>Mónica Caro | QA Automation Engineer Portfolio</title>
    <!-- Iconos profesionales oficiales -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Paleta de Colores de la Referencia */
        :root {
            --bg-light: #FFF9F9;      /* Fondo crema claro general */
            --bg-cards: #FFFFFF;      /* Fondo blanco puro para tarjetas */
            --primary-wine: #6B1D33;  /* Color vino destacado */
            --text-dark: #2A1A1E;     /* Texto principal oscuro */
            --text-muted: #6E5D61;    /* Texto secundario atenuado */
            --border-light: #F0E2E4;  /* Bordes suaves */
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        /* --- SECCIÓN HERO CORREGIDA --- */
        .hero-section {
            display: flex;
            flex-direction: column-reverse; /* Foto arriba en móviles */
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            margin-bottom: 64px;
            padding: 20px 0;
            width: 100%;
        }

        @media (min-width: 768px) {
            .hero-section {
                flex-direction: row; /* Lado a lado en computadoras */
                gap: 60px;
            }
        }

        .hero-content {
            flex: 1;
            width: 100%;
        }

        @media (min-width: 768px) {
            .hero-content {
                max-width: 60%; /* Espacio seguro para evitar que baje la imagen */
            }
        }

        .hero-greeting {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-wine);
            margin: 0 0 8px 0;
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            margin: 0 0 16px 0;
            color: var(--primary-wine);
        }

        .subtitle {
            font-size: 18px;
            color: var(--text-dark);
            margin: 0 0 20px 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .intro-text {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 32px;
        }

        /* Botones del Hero */
        .hero-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: var(--primary-wine);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: #4D1222;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-wine);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid var(--primary-wine);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background-color: rgba(107, 29, 51, 0.05);
        }

        /* Redes Sociales */
        .hero-socials {
            display: flex;
            gap: 20px;
        }

        .hero-socials a {
            color: var(--primary-wine);
            font-size: 20px;
            transition: opacity 0.3s;
            text-decoration: none;
        }

        .hero-socials a:hover {
            opacity: 0.7;
        }

        /* --- CONTENEDOR REDONDO DE LA FOTO --- */
        .hero-image-container {
            position: relative;
            width: 280px;
            height: 280px;
            flex-shrink: 0;
            border-radius: 50%; /* Fuerza forma circular */
            overflow: hidden;    /* Recorta bordes excedentes */
            border: 4px solid var(--primary-wine);
            box-shadow: 0 20px 40px rgba(107, 29, 51, 0.15);
            background-color: #ffffff;
        }

        @media (min-width: 960px) {
            .hero-image-container {
                width: 340px;
                height: 340px;
            }
        }

        .hero-profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        /* --- TÍTULOS DE SECCIÓN --- */
        .section-title-box {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 64px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-wine);
            margin: 0;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 8px;
        }

        /* --- GRID DE PROYECTOS --- */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background-color: var(--bg-cards);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(107, 29, 51, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-color: rgba(107, 29, 51, 0.08);
            color: var(--primary-wine);
        }

        .card h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-wine);
            margin: 0;
        }

        .card p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 16px 0;
            flex-grow: 1;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tech-tag {
            font-size: 11px;
            font-weight: 600;
            background-color: var(--bg-light);
            color: var(--primary-wine);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .btn-disabled {
            width: 100%;
            background-color: #f5f5f5;
            color: #a0a0a0;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 10px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: not-allowed;
            margin-top: 16px;
            text-decoration: none;
        }

        /* --- SECCIÓN HABILIDADES (BADGES) --- */
        .skills-container {
            background-color: var(--bg-cards);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 32px;
            margin-top: 24px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 640px) {
            .skills-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .skill-badge {
            background-color: var(--bg-light);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-dark);
        }

        .skill-badge i {
            font-size: 24px;
            color: var(--primary-wine);
        }

        /* --- GRID COMPLEMENTARIO DE INFORMACIÓN --- */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            margin-top: 48px;
        }

        @media (min-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .info-block {
            background-color: var(--bg-cargds);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 28px;
        }
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .info-list li {
            margi-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: var(--text-muted);
            font-size: 15px;
        }
        .info-list i {
            color: var(primmary-wine);
            margin-top: 5px;
            font-size: 12px;
        }
        footer {
            margin-top: 64px;
            padding-top: 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
        }
